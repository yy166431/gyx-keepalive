name: Build KeepAlive dylib (for TrollFools)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          clang --version

      - name: Compile KeepAlive.dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework AVFoundation \
            -install_name @executable_path/KeepAlive.dylib \
            -o KeepAlive.dylib \
            src/KeepAlive.m
          echo "=== dylib info ==="
          file KeepAlive.dylib
          otool -L KeepAlive.dylib

      - name: Sign dylib (ldid)
        run: |
          brew install ldid
          ldid -S KeepAlive.dylib
          echo "=== signed ==="
          codesign -dv KeepAlive.dylib 2>&1 || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeepAlive-dylib
          path: KeepAlive.dylib
